services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLLAB_PASSWORD:?Copy .env.example to .env and choose a strong password}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sqlserver_lab_data:/var/opt/mssql
    restart: unless-stopped
    mem_limit: 4g
volumes:
  sqlserver_lab_data:
